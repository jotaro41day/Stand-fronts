name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Instalar SDK Android
        run: sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0'
      - name: Instalar dependências
        run: npm ci
      - name: Testar
        run: npm test
      - name: Gerar arquivos web
        run: npm run build
      - name: Gerar projeto Android se ausente
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          test -f android/gradlew
      - name: Configurar Android
        run: node scripts/configureAndroid.mjs
      - name: Sincronizar Capacitor
        run: npx cap sync android
      - name: Compilar APK debug
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: stand-fronts-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
